# @cgs — the development Operating Space of atCGS: atCGS with the ./ComplexGitSync
# checkout live (editable), so a change on either side of CGS-ALPHA is seen at once.
#
#   pixi run cgs OPX login ComplexGraphSync status      (the root task hands over here)
#   pixi run -m @cgs test
#
# The root pixi.toml is atCGS as any project installs it (ComplexGitSync pinned); a
# clone without ./ComplexGitSync, such as a project's read-only gate, never reads this
# file. Tasks run from atCGS's root (cwd = ".."). Everything but the ComplexGitSync
# source must equal the root pixi.toml: tests/test_layers.py checks it.
[workspace]
name = "atCGS-dev"
version = "1.10.0-alpha"  # SemVer 2.0.0; must equal atcgs.__version__
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tasks]
cgs = { cmd = "python -m atcgs", cwd = ".." }
test = { cmd = "python -m pytest tests", cwd = ".." }
lint = { cmd = "ruff check .", cwd = ".." }
contract-inspect = { cmd = "python scripts/contract_check.py inspect", cwd = ".." }
identity-demo = { cmd = "python scripts/identity_demo.py", cwd = ".." }
local-remote = { cmd = "python scripts/local_remote.py", cwd = ".." }
deploy-keys = { cmd = "python scripts/deploy_keys.py", cwd = ".." }
bump-version = { cmd = "python .agent/.local/.dev/scripts/bump_version.py", cwd = ".." }

[dependencies]
python = "3.11.*"
pytest = "*"
ruff = "*"
hypothesis = "*"
cryptography = ">=44"

[pypi-dependencies]
complexgitsync = { path = "../ComplexGitSync", editable = true }

[target.unix.dependencies]
openssh = "*"
