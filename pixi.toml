[workspace]
name = "atCGS"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tasks]
"@cgs" = "python -m atcgs"
test = "python -m unittest discover -s tests -v"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
# Immutable CGS-ALPHA head inspected on 2026-10-30; the installed CLI
# continues to own all release/integrity semantics.
complexgitsync = { git = "https://github.com/flipoyo/ComplexGitSync.git", rev = "49f4dd5748d646d2e44001ea06a8132570ce0785" }
