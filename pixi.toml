[workspace]
name = "atCGS"
version = "1.1.0-alpha"  # SemVer 2.0.0; must equal atcgs.__version__
# Same channels, platforms and Python as the pinned ComplexGitSync pixi.toml,
# so @cgs and cgitsync observe one environment (cgitsync env check).
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

# Project name 'CGS'. The build is the executable in the Pixi environment; its
# name is lower-case(project) unless build-name is set, and is the prefix of
# commit subjects: <build-name>-<version>. cgs and cgitsync name the same build.
[tool.cgs]
project = "CGS"
# build-name = "cgs"

# Every command runs under Pixi only; @cgs refuses to start outside it.
[tasks]
"@cgs" = "python -m atcgs"
test = "python -m pytest"
lint = "ruff check ."
contract-inspect = "python scripts/contract_check.py inspect"
contract-candidate = "python scripts/contract_check.py candidate candidate.json"
poex-candidate = "python scripts/poex_4x256_simulator.py --output candidate.json"
microcode-test = "python -m pytest microcode"

[dependencies]
python = "3.11.*"
pytest = "*"
ruff = "*"
hypothesis = "*"

[pypi-dependencies]
# Immutable ComplexGitSync 8.6.2 head inspected on 2026-10-31; the installed
# CLI continues to own all release/integrity/environment semantics.
complexgitsync = { git = "https://github.com/flipoyo/ComplexGitSync.git", rev = "9594d7e51ab9008458335cda09c80538f1a0bf98" }
