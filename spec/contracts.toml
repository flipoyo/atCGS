# atCGS 1.13.0-alpha — ordered literal tuples; not .cgs grammar.
[contract]
project = "ComplexGraphSync"
version = "1.13.0-alpha"  # SemVer 2.0.0; must equal atcgs.__version__
state = "DECLARED_ONLY"
prime_g = ["NAME", "NODE", "EDGE", "OP"]
prime_cgs = ["OPX", "DEV", "USR", "PUB"]
public = ".omniscience"
private = ".cgitsync"
[boot]
identity = ["atCGS", "ALPHA", "BIOS", "ComplexGitSync", "M.m.p"]
current = [
 ["ComplexGitSync", "G", "POEX", ".gts"],
 [".gts", "G", "OPX", "TWX"],
 ["TWX", "ENV", "HWX", "DEV"],
 ["DEV", "HWX", "TWX", "USR"],
 ["USR", "TWX", "G", ".cgs"],
]
[bios_history]
sequence = [
 ["BIOS", "ENV", "HWX", "TWX"],
 ["BOOT", "TWX", "POEX", "CGS"],
 ["CGS", "POEX", "TWX", "GTS"],
 ["GTS", "TWX", "OPX", "DEV"],
 ["DEV", "HWX", "ENV", "USR"],
 ["USR", "TWX", "GTS", "TWX"],
 ["OPX", "HWX", "ENV", "TWX"],
]
extensions = [
 ["*G", "XGTS", "GX4G", "TWX"],
 ["CGS-ALPHA", "GX4G", "CGS", "TWX"],
]
[delta_nabla]
sequence = [
 ["DELTA", "POEX", "NABLA", "OPX"],
 ["OPX", "ENV", "PRIME", "DELTA"],
 ["DELTA", "ENV", "PRIME", "NABLA"],
 ["NABLA", "EDGE", "POEX", "OPX"],
]
[opfrontier]
sequence = [
 [".gts", "OPX", "DEV", ".cgs"],
 [".cgs", "DEV", "USR", ".toml"],
 [".toml", "USR", "PUB", ".omniscience"],
]
[frontiers]
".poe" = [".omniscience", ".cgs", "*G"]
".opx" = [".cgitsync", ".omniscience", ".gts"]
[public_boundary]
sequence = [
 ["README", "atCGS", "USR", "PUB"],
 ["DELTA", "POEX", "OPX", "HASH"],
 ["HASH", "DELTA", "CGS", "OPX"],
 [".cgs", "USR", "PUB", ".toml"],
]
[key]  # prototype of the class KEY; since 1.6.0 it no longer hashes a GLYPH (REFERENCE.md § 6)
prototype = [
 ["PUB", "DELTA", "POEX", "KEY"],
 ["KEY", "OPX", "CGS", "PUB"],
]
[glyph]  # the GLYPH covers a user's ssh keys: a sealed envelope, 256x256 bits at least, x4 in size when full (REFERENCE.md § 6)
sequence = [
 ["NAME", "GLYPH", "POEX", "OPX"],
 ["NAME", "GLYPH", "PUB", ".toml"],
]
shape = [256, 256]  # level 0, the smallest
bytes = 8192  # level 0
growth = 4  # level n holds 4**n times as many bytes; read from the file length, never shrinks
layout = ["CGSG", "version", "nonce", "ciphertext", "tag"]
sizes = [4, 1, 12, 8159, 16]
aead = "ChaCha20-Poly1305"
key = "HKDF-SHA256(IDSEED, info = atCGS/glyph/v1)"
published = false  # a GLYPH is never published, even sealed
[identity]  # login, password -> Ed25519; only the public key is registered (REFERENCE.md § 6)
# OPX's IDPUB, the root of trust, is not here: `@cgs OPX init` pins it in spec/opx.toml (append-only).
kdf = "Argon2id"
kdf_salt = "atCGS/id/v1/<profile>/<login>"
kdf_cost = { memory_kib = 262144, iterations = 3, lanes = 1 }
signature = "Ed25519"
uid = "sha256(IDPUB)"
journals = ["identity.jsonl", "access.jsonl"]
roles = ["OPX", "DEV", "USR"]  # PUB is the absence of a grant
codes = { OPX = "0000", DEV = "1000", USR = "1100", PUB = "1111" }  # ComplexGitSync PoE vectors; OPX is POE
